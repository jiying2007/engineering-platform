name: Verify exact Context and blocker-metadata candidate
on:
  push:
    branches: [fix/context-origin-blocker-metadata-20261013]
permissions:
  contents: read
jobs:
  verify-candidate:
    if: ${{ github.repository == 'jiying2007/engineering-platform' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write # Immutable source blobs only; no commits, branches or merge.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 3
      - name: Materialize exact approved patch on current base
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/context-evidence"
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'context-evidence'
          parts=[Path(f'.ci-context/patch.{i}.b64').read_text() for i in range(3)]
          # Restore only known transport transcription differences; original
          # immutable part hashes must match before any source is applied.
          parts[0]=parts[0].replace('R2tobup','R2t5tdobup').replace('GI3Hen74','GI3HN74').replace('Njsdba8vb','Njsdb8vb')
          parts[1]=parts[1].replace('EtrsiirsQttd','EtrsiirsrQttd')
          expected=['c1cc6b712ba3387b9d35ac58acc0893bfffd86aa','454e5926a4e2a5f8812ba351678978ec464dada5','034bdfa1d859be750dd4a1cc21a52aa23e95e6b0']
          def blob(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          actual=[]
          for i,p in enumerate(parts):
              data=p.encode();(out/f'transport.{i}.b64').write_bytes(data)
              actual.append(blob(data))
          (out/'transport-hashes.json').write_text(json.dumps({'expected':expected,'actual':actual},indent=2)+'\n')
          assert actual==expected,'source transport mismatch: no source applied'
          patch=gzip.decompress(base64.b64decode(''.join(parts),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='294e21053fdcc27638105294d8b0f6d230148e772ae009bacc51f7f296e054af'
          # PR274 appended a new section at the former EOF. Preserve its exact
          # current bytes; transplant only the old candidate's added paragraph.
          path='docs/implementation/CONTEXT_LIFECYCLE_INVENTORY_V1.md'
          sections=patch.decode().split('diff --git ')
          assert sections[0]==''
          doc=[s for s in sections[1:] if s.startswith('a/'+path+' ')];assert len(doc)==1
          added='\n'.join(line[1:] for line in doc[0].splitlines() if line.startswith('+') and not line.startswith('+++'))+'\n'
          before=Path(path).read_bytes()
          assert blob(before)=='59e3da82859629f32f7ded1e7ec8c671c49fc67e'
          marker='\n## Original armed-cancellation certificate\n'
          text=before.decode();assert text.count(marker)==1
          revised=text.replace(marker,added+marker,1).encode()
          assert blob(revised)=='610bd8eaace3c877a3e1d07665028048d9520fa7'
          remaining=''.join('diff --git '+s for s in sections[1:] if s!=doc[0]).encode()
          subprocess.run(['git','apply','--index','--check','-'],input=remaining,check=True)
          subprocess.run(['git','apply','--index','-'],input=remaining,check=True)
          Path(path).write_bytes(revised)
          subprocess.run(['git','add','--',path],check=True)
          subprocess.run(['git','rm','--cached','.github/workflows/context-candidate-once.yml',*[f'.ci-context/patch.{i}.b64' for i in range(3)]],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='07c40f550dc408adfd76c65ba54ddd212b589be4',tree
          (out/'SOURCE_TREE').write_text(tree+'\n')
          (out/'source.tar').write_bytes(subprocess.check_output(['git','archive','--format=tar',tree]))
          PY
          git diff --cached --check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate original package scripts and exact current inventory
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/context-evidence"
          go version | tee "$out/go-version.txt"
          python3 -B -m unittest discover -s scripts -p 'test_*.py' -v 2>&1 | tee "$out/python-tests.log"
          GO111MODULE=off GOWORK=off go test -json -race -count=20 scripts/context_inventory_ast.go scripts/context_inventory_ast_test.go | tee "$out/ast-race-20.jsonl"
          python3 -B scripts/authority_context_inventory.py --root . --out "$out/context-inventory.json"
          python3 -B scripts/verify_context_inventory.py --root . | tee "$out/context-binding.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'context-evidence'/'ast-race-20.jsonl'
          events=[json.loads(line) for line in p.read_text().splitlines()]
          assert not any(e['Action'] in ('fail','skip') for e in events)
          assert sum(e['Action']=='pass' and e.get('Test','').startswith('TestAST') and '/' not in e['Test'] for e in events)==60
          assert events[-1]['Action']=='pass' and 'Test' not in events[-1]
          PY
      - name: Export immutable candidate blobs without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          repo='jiying2007/engineering-platform';base='527892d3d6868612d23fb4af15b9782caaefddd5'
          assert os.environ['GITHUB_REPOSITORY']==repo
          paths=subprocess.check_output(['git','diff','--cached','--name-only',base],text=True).splitlines()
          assert len(paths)==10 and not any(p.startswith(('internal/','cmd/','.ci-context/')) for p in paths)
          records=[]
          for p in paths:
              data=Path(p).read_bytes();assert len(data)<40000
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              request=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              observed=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/blobs','--input','-'],input=request))
              assert observed['sha']==sha
              records.append({'path':p,'sha':sha,'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)})
          out=Path(os.environ['RUNNER_TEMP'])/'context-evidence'
          (out/'objects.json').write_text(json.dumps({'base':base,'tree':'07c40f550dc408adfd76c65ba54ddd212b589be4','files':records,'ref_writes':False,'production_qualified':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ always() }}
        with:
          name: context-metadata-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/context-evidence
          if-no-files-found: error
          retention-days: 30
# Temporary branch-only transport is excluded from the exact final source tree.
# No provider/model/credential/deployment action. Internal blockers [228,229] remain OPEN.
