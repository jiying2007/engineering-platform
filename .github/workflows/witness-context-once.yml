name: Verify caller-bound witness I/O candidate
on:
  push:
    branches: [fix/witness-io-context-20261013]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'jiying2007/engineering-platform' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write # Immutable source blob export only; never commit/ref writes.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify complete reviewed target tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/witness-context-evidence"
          python3 -B - <<'PY'
          import gzip,hashlib,subprocess
          from pathlib import Path
          data=Path('.ci-witness-context/patch.gz').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='e43c5dc18f0be8fdcf9443ce442f691449ca897a984dda6be8e1b60bedac750e'
          patch=gzip.decompress(data)
          assert len(patch)==26594 and hashlib.sha256(patch).hexdigest()=='c073e9515a705646d40b2507d0df1ed85e2f1dafa29edbdff39e05a47f4fe166'
          subprocess.run(['git','apply','--index','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          subprocess.run(['git','rm','--cached','.ci-witness-context/patch.gz','.github/workflows/witness-context-once.yml'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='1cb8d08630577a964f109309cd64da23f57f111d'
          PY
          git diff --cached --check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Require existing kernel test scope without relaxing host policy
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/ep-witness-context-go-tmp"
          mkdir "$tmp"
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            command -v apparmor_parser >/dev/null
            printf 'abi <abi/4.0>,\nprofile ep-witness-context-tests %s/go-build*/b*/*.test flags=(unconfined) {\n  userns,\n}\n' "$tmp" > "$RUNNER_TEMP/ep-witness-context.apparmor"
            sudo apparmor_parser -r "$RUNNER_TEMP/ep-witness-context.apparmor"
          fi
          echo "TMPDIR=$tmp" >> "$GITHUB_ENV"
          echo "EP_REQUIRE_PID_NAMESPACE_TESTS=1" >> "$GITHUB_ENV"
      - name: Prove baseline helper behavior loses cancellation and fixed suites pass
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/witness-context-evidence"
          go version | tee "$out/go-version.txt"
          go mod download
          python3 -B - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          path='internal/githubpublish/dispatch_journal.go'
          old=subprocess.check_output(['git','show','f95d0cbb6a8d88b7d713edd116f7879e59b4660c:'+path],text=True)
          helpers=old[old.index('func syncRoot('):old.index('func (j *dispatchJournal) begin')]
          # Signature-only adaptor to test unchanged original helper bodies with
          # the new required caller-Context interface; not an old binary claim.
          helpers=helpers.replace('func writeWitness(r ','func writeWitness(_ context.Context, r ').replace('func readWitness(r ','func readWitness(_ context.Context, r ')
          current=Path(path).read_text()
          out=Path(os.environ['RUNNER_TEMP'])/'witness-context-evidence'
          target=out/'original-helper-body.go'
          target.write_text(current[:current.index('func syncRoot(')]+helpers+current[current.index('func (j *dispatchJournal) begin'):])
          (out/'overlay.json').write_text(json.dumps({'Replace':{str(Path(path).resolve()):str(target)}}))
          PY
          set +e
          go test -overlay "$out/overlay.json" -json -race -count=1 -timeout 2m ./internal/githubpublish -run '^TestPublisherWitnessIntegrityContext(WriteMarshallingCancellation|ReadDecodeCancellation)$' > "$out/original-helper-negative.jsonl" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -F 'marshal cancellation lost' "$out/original-helper-negative.jsonl"
          grep -F 'decoded cancelled witness accepted' "$out/original-helper-negative.jsonl"
          ! grep -Fq '"Action":"skip"' "$out/original-helper-negative.jsonl"
          go test -json -race -count=20 -timeout 2m ./internal/githubpublish -run '^TestPublisherWitnessIntegrityContext' | tee "$out/witness-context-20.jsonl"
          go test -json -race -count=3 -timeout 3m ./internal/githubpublish | tee "$out/publisher-all-3.jsonl"
          python3 -B - <<'PY'
          import os,re,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import verify_publication_recovery_log as gate
          out=Path(os.environ['RUNNER_TEMP'])/'witness-context-evidence'
          names=set(re.findall(r'^func (TestPublisherWitnessIntegrityContext\w+)\(',Path('internal/githubpublish/witness_context_test.go').read_text(),re.M))
          assert len(names)==6
          gate.verify(out/'witness-context-20.jsonl',repeats=20,required=names,package=gate.PUBLISHER_PACKAGE)
          gate.verify(out/'publisher-all-3.jsonl',repeats=3,required=gate.PROOF_REQUIRED,package=gate.PUBLISHER_PACKAGE)
          PY
          python3 -B -m unittest discover -s scripts -p 'test_*.py' -v 2>&1 | tee "$out/python-tests.log"
          python3 -B scripts/verify_context_inventory.py --root . | tee "$out/context-inventory.json"
          go vet ./internal/githubpublish
      - name: Export only immutable validated source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          repo='jiying2007/engineering-platform';base='f95d0cbb6a8d88b7d713edd116f7879e59b4660c';tree='1cb8d08630577a964f109309cd64da23f57f111d'
          assert os.environ['GITHUB_REPOSITORY']==repo
          paths=subprocess.check_output(['git','diff','--cached','--name-only',base],text=True).splitlines()
          assert len(paths)==11 and all(not p.startswith(('.github/','.ci-','cmd/')) for p in paths)
          files=[]
          for name in paths:
            data=Path(name).read_bytes();assert len(data)<100000
            sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            payload=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode()
            obj=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/blobs','--input','-'],input=payload))
            assert obj['sha']==sha
            files.append({'path':name,'sha':sha,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          out=Path(os.environ['RUNNER_TEMP'])/'witness-context-evidence'
          (out/'source-objects.json').write_text(json.dumps({'base':base,'tree':tree,'files':files,'ref_writes':False,'provider_executed':False,'production_qualified':False},indent=2)+'\n')
          (out/'source.tar').write_bytes(subprocess.check_output(['git','archive','--format=tar',tree]))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ always() }}
        with:
          name: witness-context-validation-${{ github.sha }}
          path: ${{ runner.temp }}/witness-context-evidence
          if-no-files-found: error
          retention-days: 30
# Temporary branch-only transport; absent from the exact final production tree.
# No commits/refs/model/provider/deployment/credential changes from this job.
