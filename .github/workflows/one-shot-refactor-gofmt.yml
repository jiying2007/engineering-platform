name: One-shot refactor gofmt

on:
  push:
    branches:
      - refactor/codex-provider-credential-execution-axes

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/codex-provider-credential-execution-axes
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Format refactor and remove formatter
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w .
          rm -f .github/workflows/one-shot-refactor-gofmt.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "no formatting changes"
            exit 0
          fi
          git commit -m "style(go): format provider identity refactor"
          git push origin HEAD:refactor/codex-provider-credential-execution-axes
