name: Temporary Control oracle Go verification (no Codex)

on:
  push:
    branches: [fix/control-nested-response-alias-20261027]

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'jiying2007/engineering-platform' && github.ref == 'refs/heads/fix/control-nested-response-alias-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 36470ce24a68a7446c4a6901ed7beeb34fb3ba50
          persist-credentials: false
      - name: Install repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Source-bound Go 1.26.10 package qualification without models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oracle-proof"
          test "$(git rev-parse HEAD)" = '36470ce24a68a7446c4a6901ed7beeb34fb3ba50'
          git rev-parse HEAD | tee "$RUNNER_TEMP/oracle-proof/checked-source-sha.txt"
          go version | tee "$RUNNER_TEMP/oracle-proof/go-version.txt"
          test "$(go version | awk '{print $3}')" = 'go1.26.10'
          test "$(git hash-object internal/controlclient/response.go)" = 'd78953580ab93dd0e508e498e4e3d67a4a5a8a9d'
          test "$(git hash-object internal/controlclient/response_alias_oracle_test.go)" = '82c22e30cd78e76b3cfca57c0e97d243cfce008c'
          test "$(git hash-object internal/controlclient/response_alias_top_level_test.go)" = '3a1f22f51a174c50c9a7209dc92653c664d5ddf1'
          test -z "$(gofmt -l internal/controlclient/*.go)"
          timeout 240s go mod download
          timeout 420s go test -race -count=5 -timeout=6m ./internal/controlclient ./internal/strictjson 2>&1 | tee "$RUNNER_TEMP/oracle-proof/go-race.txt"
          timeout 180s go vet ./... 2>&1 | tee "$RUNNER_TEMP/oracle-proof/go-vet-all.txt"
          echo 'SOURCE_ONLY: no Codex, ChatGPT Work, Provider, or production qualification' | tee "$RUNNER_TEMP/oracle-proof/scope.txt"
      - name: Retain source-bound proof on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: temporary-control-oracle-${{ github.sha }}
          path: ${{ runner.temp }}/oracle-proof/
          if-no-files-found: warn
          retention-days: 30
  full-go:
    name: supplemental full Go repository suite (no Codex)
    if: github.repository == 'jiying2007/engineering-platform' && github.ref == 'refs/heads/fix/control-nested-response-alias-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engineering_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d engineering_platform"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/engineering_platform?sslmode=disable
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 36470ce24a68a7446c4a6901ed7beeb34fb3ba50
          persist-credentials: false
      - name: Configure Go 1.26.10
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Run bounded full Go race suite without Codex executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/full-go-proof"
          test "$(git rev-parse HEAD)" = '36470ce24a68a7446c4a6901ed7beeb34fb3ba50'
          test "$(go version | awk '{print $3}')" = 'go1.26.10'
          if command -v codex >/dev/null 2>&1; then echo 'Codex CLI present; refusing to execute this suite' >&2; exit 1; fi
          git rev-parse HEAD | tee "$RUNNER_TEMP/full-go-proof/source-sha.txt"
          go version | tee "$RUNNER_TEMP/full-go-proof/toolchain.txt"
          timeout 240s go mod download
          tmp="$RUNNER_TEMP/ep-go-test-temp"
          mkdir "$tmp"
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            command -v apparmor_parser >/dev/null
            printf 'abi <abi/4.0>,\nprofile ep-namespace-go-tests %s/go-build*/b*/*.test flags=(unconfined) {\n  userns,\n}\n' "$tmp" > "$RUNNER_TEMP/ep-go-tests.apparmor"
            sudo apparmor_parser -r "$RUNNER_TEMP/ep-go-tests.apparmor"
          fi
          export TMPDIR="$tmp" EP_REQUIRE_PID_NAMESPACE_TESTS=1
          timeout 720s go test -race -timeout 5m ./... 2>&1 | tee "$RUNNER_TEMP/full-go-proof/all-go-race.txt"
          echo 'SUPPLEMENTARY_ONLY: no Codex, Work, Provider or protected PR qualifier' | tee "$RUNNER_TEMP/full-go-proof/scope.txt"
      - name: Preserve full suite source log on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: supplemental-full-go-${{ github.sha }}
          path: ${{ runner.temp }}/full-go-proof/
          if-no-files-found: warn
          retention-days: 30
