name: Temporary Relay pinned output writer Go verification (no Codex)

on:
  push:
    branches: [fix/relay-input-no-follow-20261029]

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'jiying2007/engineering-platform' && github.ref == 'refs/heads/fix/relay-input-no-follow-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engineering_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d engineering_platform"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/engineering_platform?sslmode=disable
    steps:
      - name: Checkout immutable source (no credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 07cebdb1c0b61087c7d95ff53e068c767c9194fe
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate exact source and run no-Codex Go tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/relay-source-proof"
          test "$(git rev-parse HEAD)" = '07cebdb1c0b61087c7d95ff53e068c767c9194fe'
          git rev-parse HEAD | tee "$RUNNER_TEMP/relay-source-proof/exact-head.txt"
          go version | tee "$RUNNER_TEMP/relay-source-proof/go-version.txt"
          test "$(go version | awk '{print $3}')" = 'go1.26.10'
          if command -v codex >/dev/null 2>&1; then echo 'Unexpected real Codex executable: refusing' >&2; exit 1; fi
          test "$(git hash-object cmd/eng/relay_input.go)" = 'e9f77e6b124d0e4d17923d9794aaaf0bcd8f2aa5'
          test "$(git hash-object cmd/eng/relay_verify_qualification_kit.go)" = '2157288c16e26cfd6b26015009dc710deff8dc4f'
          test "$(git hash-object cmd/eng/relay_kit_directory_bound_test.go)" = '01d42b0251504ac1a06c2e8e32ceac0507554105'
          test "$(git hash-object cmd/eng/relay_qualification_kit.go)" = '9c7776fc138ca42ff388e98c979dd86263547df1'
          test "$(git hash-object cmd/eng/relay_kit_output_test.go)" = 'fbc9cff519dcc3f82760344b2cd6658dc51c0fe9'
          test "$(git hash-object cmd/eng/relay_input_root_linux.go)" = '0dc32ebd2c52b38e1003f6e2c32f6875275bfc0d'
          test "$(git hash-object cmd/eng/relay_input_root_other.go)" = 'fbd363c1a635636b96cf69ab10eb497914c7c8c2'
          test "$(git hash-object cmd/eng/relay_input_root_test.go)" = '3ad2d0f7fb2ea1cd9ef8bca0f7fdffdeebbb1416'
          test "$(git hash-object cmd/eng/relay_input_test.go)" = '20821924adcbe6954194e62feca21ae45d2e123a'
          test -z "$(gofmt -l cmd/eng/relay_input.go cmd/eng/relay_input_test.go cmd/eng/relay_input_root_linux.go cmd/eng/relay_input_root_other.go cmd/eng/relay_input_root_test.go cmd/eng/relay_kit_directory_bound_test.go cmd/eng/relay_qualification_kit.go cmd/eng/relay_kit_output_test.go cmd/eng/relay_prequalification.go cmd/eng/relay_runtime_handoff.go cmd/eng/relay_prequalification_pack.go cmd/eng/relay_verify_qualification_kit.go)"
          timeout 240s go mod download
          timeout 240s go test -race -count=20 -timeout=3m ./cmd/eng -run '^(TestRelayQualificationKitOutputPinnedToOriginalDirectory|TestRelayQualificationKitWriterRequiresExactPrivateMember|TestRelayQualificationKitCreatesCompleteOwnerPrivateBundle|TestRelayKitDirectoryEnumerationIsBounded|TestRelayBoundedInputRejectsUnsafeFiles|TestRelayRootInputAnchoredAfterDirectoryReplacement|TestRelayVerifyQualificationKitAcceptsBuiltDirectory|TestRelayVerifyQualificationKitRejectsSymlinkEntry)$' 2>&1 | tee "$RUNNER_TEMP/relay-source-proof/targeted-race.txt"
          tmp="$RUNNER_TEMP/ep-relay-go-tests"
          mkdir "$tmp"
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            command -v apparmor_parser >/dev/null
            printf 'abi <abi/4.0>,\nprofile ep-namespace-go-tests %s/go-build*/b*/*.test flags=(unconfined) {\n  userns,\n}\n' "$tmp" > "$RUNNER_TEMP/ep-relay-go.apparmor"
            sudo apparmor_parser -r "$RUNNER_TEMP/ep-relay-go.apparmor"
          fi
          export TMPDIR="$tmp" EP_REQUIRE_PID_NAMESPACE_TESTS=1
          timeout 720s go test -race -timeout 5m ./... 2>&1 | tee "$RUNNER_TEMP/relay-source-proof/full-go-race.txt"
          timeout 180s go vet ./... 2>&1 | tee "$RUNNER_TEMP/relay-source-proof/vet.txt"
          echo 'SOURCE_ONLY: no Codex, ChatGPT Work, model, Provider, or production qualification' | tee "$RUNNER_TEMP/relay-source-proof/scope.txt"
      - name: Retain exact-source logs on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: temporary-relay-input-nocodex-${{ github.sha }}
          path: ${{ runner.temp }}/relay-source-proof/
          if-no-files-found: warn
          retention-days: 30
