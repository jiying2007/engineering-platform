name: Codex WIF live qualification

on:
  workflow_dispatch:
    inputs:
      model:
        description: Exact Codex model available to the mapped managed-workspace principal
        required: true
        default: gpt-5.6-sol
        type: string
      codex_version:
        description: Codex CLI package version to compatibility-qualify for this live probe
        required: true
        default: 0.157.1
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  live:
    name: one-read-only-model-turn
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require protected main workflow invocation
        shell: bash
        env:
          OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
          OPENAI_CODEX_FEDERATION_RULE_ID: ${{ vars.OPENAI_CODEX_FEDERATION_RULE_ID }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_TYPE" = "branch"
          test "$GITHUB_REF_PROTECTED" = "true"
          test "$GITHUB_REPOSITORY" = "jiying2007/engineering-platform"

          missing=0
          for name in OPENAI_WIF_AUDIENCE OPENAI_CODEX_FEDERATION_RULE_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name repository Actions variable is not configured"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::managed-workspace WIF is not provisioned; follow issue #103 / examples/pilots/wif/configure-admin-api.sh"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install selected Codex native binary
        shell: bash
        env:
          CODEX_VERSION: ${{ inputs.codex_version }}
        run: |
          set -euo pipefail
          [[ "$CODEX_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          root="$RUNNER_TEMP/codex-$CODEX_VERSION"
          npm install --prefix "$root" --omit=dev --ignore-scripts --package-lock=false "@openai/codex@$CODEX_VERSION"
          mapfile -t candidates < <(find "$root/node_modules" -type f -name codex -perm -u+x | sort)
          test "${#candidates[@]}" -eq 1
          codex="$(readlink -f "${candidates[0]}")"
          test "$("$codex" --version)" = "codex-cli $CODEX_VERSION"
          printf 'CODEX_NATIVE=%s\n' "$codex" >> "$GITHUB_ENV"
          printf 'CODEX_DIGEST=sha256:%s\n' "$(sha256sum "$codex" | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Require Codex Linux sandbox prerequisite
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          export NEEDRESTART_MODE=l
          sudo -E apt-get update -qq
          sudo -E apt-get install -y --no-install-recommends bubblewrap apparmor-profiles apparmor-utils
          if [ -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict ]; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          bwrap --ro-bind / / --proc /proc --dev /dev /bin/true
      - name: Compatibility-qualify selected Codex binary without a model turn
        shell: bash
        env:
          LIVE_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          go run ./cmd/codex-qualifier \
            --codex "$CODEX_NATIVE" \
            --model "$LIVE_MODEL" \
            > "$RUNNER_TEMP/codex-compatibility-qualification.json"
          jq -e --arg digest "$CODEX_DIGEST" '
            .schema_version == 3 and
            .compatibility_contract_version == 2 and
            .isolated_engineering_startup == true and
            .namespace_init_reaped == true and
            .model_turn_executed == false and
            .credential_used == false and
            .binary_digest == $digest
          ' "$RUNNER_TEMP/codex-compatibility-qualification.json" >/dev/null
      - name: Mint and verify one GitHub OIDC assertion
        shell: bash
        env:
          OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
        run: |
          set -euo pipefail
          umask 077
          secret_dir="$RUNNER_TEMP/openai-wif"
          install -d -m 0700 "$secret_dir"
          encoded="$(jq -rn --arg audience "$OPENAI_WIF_AUDIENCE" '$audience|@uri')"
          token="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded}" | jq -er .value)"
          printf '%s' "$token" > "$secret_dir/identity-token"
          unset token
          chmod 0600 "$secret_dir/identity-token"
          python3 examples/pilots/wif/verify-github-oidc.py \
            --token-file "$secret_dir/identity-token" \
            --audience "$OPENAI_WIF_AUDIENCE" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --ref "$GITHUB_REF" \
            --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/codex-wif-live.yml@refs/heads/main" \
            --max-lifetime-seconds 600 \
            --min-remaining-seconds 120
          printf 'OPENAI_IDENTITY_TOKEN_FILE=%s\n' "$secret_dir/identity-token" >> "$GITHUB_ENV"
      - name: Perform exactly one WIF read-only model turn
        shell: bash
        env:
          OPENAI_FEDERATION_RULE_ID: ${{ vars.OPENAI_CODEX_FEDERATION_RULE_ID }}
          LIVE_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/codex-live-work"
          home="$RUNNER_TEMP/codex-live-home"
          install -d -m 0700 "$work" "$home"
          context="$(jq -cn --arg run_id "$GITHUB_RUN_ID" --arg repository "$GITHUB_REPOSITORY" --arg source_sha "$GITHUB_SHA" '{github_run_id:$run_id,repository:$repository,source_sha:$source_sha}')"
          go run ./cmd/codex-wif-live \
            --codex "$CODEX_NATIVE" \
            --digest "$CODEX_DIGEST" \
            --work "$work" \
            --home "$home" \
            --federation-rule "$OPENAI_FEDERATION_RULE_ID" \
            --identity-token-file "$OPENAI_IDENTITY_TOKEN_FILE" \
            --audit-context "$context" \
            --model "$LIVE_MODEL" \
            > "$RUNNER_TEMP/codex-wif-live-receipt.json"
          cat "$RUNNER_TEMP/codex-wif-live-receipt.json"
      - name: Retain real live-turn receipt
        uses: actions/upload-artifact@v6
        with:
          name: codex-wif-live-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/codex-wif-live-receipt.json
            ${{ runner.temp }}/codex-compatibility-qualification.json
          if-no-files-found: error
          retention-days: 90
      - name: Destroy identity assertion
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/openai-wif"
