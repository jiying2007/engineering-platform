name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engineering_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d engineering_platform"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/engineering_platform?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Download Go modules with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Go module download failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - name: Module hygiene
        shell: bash
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum || [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "go.mod/go.sum are not tidy; commit the generated module metadata."
            git status --short -- go.mod go.sum
            if [ -f go.sum ]; then
              echo "----- BEGIN GENERATED go.sum -----"
              cat go.sum
              echo "----- END GENERATED go.sum -----"
            fi
            exit 1
          fi
      - name: Format check
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following Go files are not gofmt-clean:"
            echo "$files"
            echo
            echo "gofmt diff:"
            gofmt -d .
            exit 1
          fi
      - name: Require kernel process-scope tests
        shell: bash
        run: |
          set -euo pipefail
          # Test-only AppArmor userns permission, scoped to this job's Go test
          # executables. Never disable the host-wide userns restriction.
          tmp="$RUNNER_TEMP/ep-namespace-go-tmp"
          mkdir "$tmp"
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            command -v apparmor_parser >/dev/null
            printf 'abi <abi/4.0>,\nprofile ep-namespace-go-tests %s/go-build*/b*/*.test flags=(unconfined) {\n  userns,\n}\n' "$tmp" > "$RUNNER_TEMP/ep-namespace-tests.apparmor"
            sudo apparmor_parser -r "$RUNNER_TEMP/ep-namespace-tests.apparmor"
          fi
          echo "TMPDIR=$tmp" >> "$GITHUB_ENV"
          echo "EP_REQUIRE_PID_NAMESPACE_TESTS=1" >> "$GITHUB_ENV"
      - name: Test
        run: go test -race -timeout 5m ./...
      - name: Kernel process-tree regression
        run: go test -race -count=10 -timeout 1m ./internal/processscope
      - name: Outbox authority repeated regression
        run: |
          go test -race -count=20 -timeout 1m ./internal/outbox
          go test -race -shuffle=on -count=3 -timeout 2m ./internal/store/postgres -run 'TestPostgres(Outbox|EverySettlement|RecoveryAfterClaim|DispatchHolds|ConcurrentDispatch|MismatchedRisk|ExpiredAndCancelled|UnknownOutcome|RiskRejection|FaultInjectionSchemaIsolation)'
      - name: Prepared Runtime and Context repeated regression
        run: go test -race -count=10 -timeout 2m ./internal/runtime/codexapp ./internal/contextbundle
      - name: Worker admission repeated regression
        run: |
          go test -race -count=20 -timeout 2m ./internal/workerqueue ./internal/workeragent ./internal/workerloop ./internal/controlclient
          go test -race -shuffle=on -count=3 -timeout 2m ./internal/store/postgres -run TestWorkerInbox
          go test -race -count=3 -timeout 2m ./cmd/control-plane -run TestWorkerCommand
      - name: Worker preparation and independent workspace regression
        run: |
          go test -race -count=5 -timeout 2m ./internal/workspace ./internal/preparation
          go test -race -shuffle=on -count=3 -timeout 2m ./internal/store/postgres -run TestPreparationStore
          go test -race -count=3 -timeout 3m ./cmd/control-plane -run TestPreparationCommand
      - name: Offline authority repeated database regression
        run: go test -race -shuffle=on -count=3 -timeout 2m ./internal/store/postgres -run TestOfflineStore
      - name: Recovery proof repeated database regression
        run: go test -race -shuffle=on -count=3 -timeout 2m ./internal/store/postgres -run 'Test(PostgresRecoveryLifecycle|RecoveryProof)'
      - name: Vet
        run: go vet ./...
      - name: Build candidate binaries with raw-byte manifest
        shell: bash
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/engineering-dist"
          bash scripts/build-distribution.sh "$dist"
          python3 scripts/test-distribution.py "$dist"
          install_root="$RUNNER_TEMP/engineering-install-smoke"
          mkdir "$install_root"
          cp -a "$dist/." "$install_root/"
          (cd "$install_root" && ./eng distribution-verify --dir "$install_root" && ./eng --help && ./eng capabilities >/dev/null)
      - name: Retain candidate binary bytes
        uses: actions/upload-artifact@v4
        with:
          name: engineering-binaries-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/engineering-dist
          if-no-files-found: error
          retention-days: 30

  offline:
    name: offline-container-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engineering_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d engineering_platform"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/engineering_platform?sslmode=disable
      EP_SANDBOX_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Download Go modules with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Go module download failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - name: Require real container environment
        run: |
          test "$(id -u)" -ne 0
          test -S /var/run/docker.sock
          docker version
      - name: Real offline boundary and command integration
        run: go test -race -v -count=3 -timeout 7m ./internal/sandbox ./cmd/control-plane -run 'TestRealOffline|TestOfflineCommand'


  restore:
    name: postgres-authority-restore-drill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engineering_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d engineering_platform"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/engineering_platform?sslmode=disable
      EP_RESTORE_DRILL: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Download Go modules with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Go module download failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - name: Require PostgreSQL 17 dump/restore environment
        run: |
          set -euo pipefail
          test -S /var/run/docker.sock
          docker version
          docker image inspect postgres:17-alpine >/dev/null 2>&1 || docker pull postgres:17-alpine
      - name: Restore authoritative Core state and complete recovered epoch
        run: go test -race -v -count=1 -timeout 8m ./internal/store/postgres -run TestPostgresAuthorityRestoreDrill

  codex:
    name: codex-app-server-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODEX_COMPATIBILITY_BASELINE_VERSION: '0.157.1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Download Go modules with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Go module download failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CI compatibility-baseline Codex package
        shell: bash
        run: |
          set -euo pipefail
          version="$CODEX_COMPATIBILITY_BASELINE_VERSION"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          root="$RUNNER_TEMP/codex-$version"
          npm install --prefix "$root" --omit=dev --ignore-scripts --package-lock=false "@openai/codex@$version"
          npm view "@openai/codex@$version" dist.integrity > "$RUNNER_TEMP/codex-npm-integrity.txt"
          mapfile -t candidates < <(find "$root/node_modules" -type f -name codex -perm -u+x | sort)
          printf 'native candidates: %s\n' "${candidates[*]-}"
          test "${#candidates[@]}" -eq 1
          codex="$(readlink -f "${candidates[0]}")"
          test -x "$codex"
          test "$("$codex" --version)" = "codex-cli $version"
          printf 'CODEX_NATIVE=%s\n' "$codex" >> "$GITHUB_ENV"
      - name: Require Linux sandbox prerequisite
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          export NEEDRESTART_MODE=l
          sudo -E apt-get update -qq
          sudo -E apt-get install -y --no-install-recommends bubblewrap apparmor-profiles apparmor-utils
          command -v bwrap
          bwrap --version
          if [ -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict ]; then
            sudo install -m 0644 \
              /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
              /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          bwrap --ro-bind / / --proc /proc --dev /dev /bin/true
      - name: Qualify real stable app-server and generated protocol
        shell: bash
        run: |
          set -euo pipefail
          qualifier="$RUNNER_TEMP/isolated-codex-qualifier"
          go build -trimpath -o "$qualifier" ./cmd/codex-qualifier
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            printf 'abi <abi/4.0>,\nprofile ep-real-codex-qualification %s flags=(unconfined) {\n  userns,\n}\n' "$qualifier" > "$RUNNER_TEMP/ep-real-codex-qualification.apparmor"
            sudo apparmor_parser -r "$RUNNER_TEMP/ep-real-codex-qualification.apparmor"
          fi
          "$qualifier" --codex "$CODEX_NATIVE" --model gpt-5.6-sol > "$RUNNER_TEMP/codex-qualification.json"
          # Qualification identity must be stable across distinct scoped lifetimes.
          "$qualifier" --codex "$CODEX_NATIVE" --model gpt-5.6-sol > "$RUNNER_TEMP/codex-qualification-repeat.json"
          cmp "$RUNNER_TEMP/codex-qualification.json" "$RUNNER_TEMP/codex-qualification-repeat.json"
          cat "$RUNNER_TEMP/codex-qualification.json"
      - name: Retain Codex qualification receipt
        uses: actions/upload-artifact@v4
        with:
          name: codex-compatibility-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/codex-qualification.json
            ${{ runner.temp }}/codex-npm-integrity.txt
          if-no-files-found: error
          retention-days: 30


  evidence:
    name: trusted-ci-artifact-evidence
    needs: [go, offline, restore, codex]
    if: ${{ always() && needs.go.result == 'success' && needs.offline.result == 'success' && needs.restore.result == 'success' && needs.codex.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Download Go modules with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Go module download failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - name: Collect exact Git, CI and artifact facts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl -fsSL "${auth[@]}" "$api/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          curl -fsSL "${auth[@]}" "$api/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"

          jq -e '[.jobs[] | select(.name=="go" or .name=="offline-container-integration" or .name=="postgres-authority-restore-drill" or .name=="codex-app-server-qualification") | {name:.name,id:.id,conclusion:.conclusion}] | length==4 and all(.[]; .conclusion=="success")' "$RUNNER_TEMP/jobs.json" >/dev/null
          binary_id="$(jq -er '.artifacts[] | select(.name|startswith("engineering-binaries-")) | .id' "$RUNNER_TEMP/artifacts.json")"
          codex_id="$(jq -er '.artifacts[] | select(.name|startswith("codex-compatibility-qualification-")) | .id' "$RUNNER_TEMP/artifacts.json")"
          test -n "$binary_id" -a -n "$codex_id"

          curl -fsSL -L "${auth[@]}" "$api/actions/artifacts/$binary_id/zip" -o "$RUNNER_TEMP/binaries.zip"
          mkdir "$RUNNER_TEMP/binaries"
          unzip -q "$RUNNER_TEMP/binaries.zip" -d "$RUNNER_TEMP/binaries"
          manifest="$(find "$RUNNER_TEMP/binaries" -type f -name file-manifest.json -print -quit)"
          test -n "$manifest"
          while IFS= read -r role; do chmod 0755 "$RUNNER_TEMP/binaries/$role"; done < internal/distribution/binaries.txt
          "$RUNNER_TEMP/binaries/eng" distribution-verify --dir "$RUNNER_TEMP/binaries"

          jobs="$(jq -c '[.jobs[] | select(.name=="go" or .name=="offline-container-integration" or .name=="postgres-authority-restore-drill" or .name=="codex-app-server-qualification") | {name:.name,id:.id,conclusion:.conclusion}] | sort_by(.name)' "$RUNNER_TEMP/jobs.json")"
          artifacts="$(jq -c '[.artifacts[] | select((.name|startswith("engineering-binaries-")) or (.name|startswith("codex-compatibility-qualification-"))) | {name:.name,id:.id,digest:.digest,size:.size_in_bytes}] | sort_by(.name)' "$RUNNER_TEMP/artifacts.json")"
          files="$(jq -c '.' "$manifest")"
          tested_sha="$(git rev-parse HEAD)"
          event="$GITHUB_EVENT_NAME"
          jq -n \
            --argjson schema_version 2 \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg event "$event" \
            --arg source_sha "$SOURCE_SHA" \
            --arg tested_sha "$tested_sha" \
            --arg base_sha "$BASE_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson jobs "$jobs" \
            --argjson artifacts "$artifacts" \
            --argjson files "$files" \
            '{schema_version:$schema_version,repository:$repository,workflow:$workflow,event:$event,source_sha:$source_sha,tested_sha:$tested_sha,base_sha:$base_sha,run_id:$run_id,run_attempt:$run_attempt,jobs:$jobs,artifacts:$artifacts,files:$files}' \
            > "$RUNNER_TEMP/ci-evidence-raw.json"
          if [ "$event" = push ]; then
            jq 'del(.base_sha)' "$RUNNER_TEMP/ci-evidence-raw.json" > "$RUNNER_TEMP/ci-evidence-receipt.json"
          else
            cp "$RUNNER_TEMP/ci-evidence-raw.json" "$RUNNER_TEMP/ci-evidence-receipt.json"
          fi
          go run ./cmd/ci-evidence --input "$RUNNER_TEMP/ci-evidence-receipt.json" > "$RUNNER_TEMP/ci-evidence-envelope.json"
          cat "$RUNNER_TEMP/ci-evidence-envelope.json"
      - name: Retain verified CI evidence envelope
        uses: actions/upload-artifact@v4
        with:
          name: trusted-ci-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ci-evidence-envelope.json
          if-no-files-found: error
          retention-days: 90