name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engineering_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d engineering_platform"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/engineering_platform?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Module hygiene
        shell: bash
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum || [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "go.mod/go.sum are not tidy; commit the generated module metadata."
            git status --short -- go.mod go.sum
            if [ -f go.sum ]; then
              echo "----- BEGIN GENERATED go.sum -----"
              cat go.sum
              echo "----- END GENERATED go.sum -----"
            fi
            exit 1
          fi
      - name: Format check
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following Go files are not gofmt-clean:"
            echo "$files"
            echo
            echo "gofmt diff:"
            gofmt -d .
            exit 1
          fi
      - name: Test
        run: go test -race -timeout 5m ./...
      - name: Outbox authority repeated regression
        run: |
          go test -race -count=20 -timeout 1m ./internal/outbox
          go test -race -shuffle=on -count=3 -timeout 2m ./internal/store/postgres -run 'TestPostgres(Outbox|EverySettlement|RecoveryAfterClaim|DispatchHolds|ConcurrentDispatch|MismatchedRisk|ExpiredAndCancelled|UnknownOutcome|RiskRejection|FaultInjectionSchemaIsolation)'
      - name: Prepared Runtime and Context repeated regression
        run: go test -race -count=10 -timeout 2m ./internal/runtime/codexapp ./internal/contextbundle
      - name: Worker admission repeated regression
        run: |
          go test -race -count=20 -timeout 2m ./internal/workerqueue ./internal/workeragent ./internal/workerloop ./internal/controlclient
          go test -race -shuffle=on -count=3 -timeout 2m ./internal/store/postgres -run TestWorkerInbox
          go test -race -count=3 -timeout 2m ./cmd/control-plane -run TestWorkerCommand
      - name: Worker preparation and independent workspace regression
        run: |
          go test -race -count=5 -timeout 2m ./internal/workspace ./internal/preparation
          go test -race -shuffle=on -count=3 -timeout 2m ./internal/store/postgres -run TestPreparationStore
          go test -race -count=3 -timeout 3m ./cmd/control-plane -run TestPreparationCommand
      - name: Offline authority repeated database regression
        run: go test -race -shuffle=on -count=3 -timeout 2m ./internal/store/postgres -run TestOfflineStore
      - name: Vet
        run: go vet ./...
      - name: Build binaries
        run: |
          go build ./cmd/control-plane
          go build ./cmd/eng
          go build ./cmd/worker
          CGO_ENABLED=0 go build ./cmd/sandbox-guard

  offline:
    name: offline-container-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engineering_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d engineering_platform"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/engineering_platform?sslmode=disable
      EP_SANDBOX_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Require real container environment
        run: |
          test "$(id -u)" -ne 0
          test -S /var/run/docker.sock
          docker version
          go mod download
      - name: Real offline boundary and command integration
        run: go test -race -v -count=2 -timeout 5m ./internal/sandbox ./cmd/control-plane -run 'TestRealOffline|TestOfflineCommand'


  codex:
    name: codex-app-server-0.155.0-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact stable Codex package and locate native binary
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/codex-0.155.0"
          npm install --prefix "$root" --omit=dev --ignore-scripts --package-lock=false @openai/codex@0.155.0
          npm view @openai/codex@0.155.0 dist.integrity > "$RUNNER_TEMP/codex-npm-integrity.txt"
          mapfile -t candidates < <(find "$root/node_modules" -type f -name codex -perm -u+x | sort)
          printf 'native candidates: %s\n' "${candidates[*]-}"
          test "${#candidates[@]}" -eq 1
          codex="$(readlink -f "${candidates[0]}")"
          test -x "$codex"
          test "$("$codex" --version)" = "codex-cli 0.155.0"
          printf 'CODEX_NATIVE=%s\n' "$codex" >> "$GITHUB_ENV"
      - name: Require Linux sandbox prerequisite
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles apparmor-utils
          command -v bwrap
          bwrap --version
          if [ -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict ]; then
            sudo install -m 0644 \
              /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
              /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          bwrap --ro-bind / / --proc /proc --dev /dev /bin/true
      - name: Qualify real stable app-server and generated protocol
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/codex-qualifier \
            --codex "$CODEX_NATIVE" \
            --version 0.155.0 \
            --model gpt-5.6-sol \
            > "$RUNNER_TEMP/codex-qualification.json"
          cat "$RUNNER_TEMP/codex-qualification.json"
      - name: Retain Codex qualification receipt
        uses: actions/upload-artifact@v4
        with:
          name: codex-0.155.0-qualification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/codex-qualification.json
            ${{ runner.temp }}/codex-npm-integrity.txt
          if-no-files-found: error
          retention-days: 30
