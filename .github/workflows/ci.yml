name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engineering_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d engineering_platform"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/engineering_platform?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Module hygiene
        shell: bash
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum || [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "go.mod/go.sum are not tidy; commit the generated module metadata."
            git status --short -- go.mod go.sum
            if [ -f go.sum ]; then
              echo "----- BEGIN GENERATED go.sum -----"
              cat go.sum
              echo "----- END GENERATED go.sum -----"
            fi
            exit 1
          fi
      - name: Format check
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following Go files are not gofmt-clean:"
            echo "$files"
            echo
            echo "gofmt diff:"
            gofmt -d .
            exit 1
          fi
      - name: Test
        run: go test -race -timeout 5m ./...
      - name: Vet
        run: go vet ./...
      - name: Build binaries
        run: |
          go build ./cmd/control-plane
          go build ./cmd/eng
          go build ./cmd/worker
