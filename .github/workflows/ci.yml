name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engineering_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d engineering_platform"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/engineering_platform?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Module hygiene
        shell: bash
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum || [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "go.mod/go.sum are not tidy; commit the generated module metadata."
            git status --short -- go.mod go.sum
            if [ -f go.sum ]; then
              echo "----- BEGIN GENERATED go.sum -----"
              cat go.sum
              echo "----- END GENERATED go.sum -----"
            fi
            exit 1
          fi
      - name: Format check
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following Go files are not gofmt-clean:"
            echo "$files"
            echo
            echo "gofmt diff:"
            gofmt -d .
            exit 1
          fi
      - name: Test
        run: go test -race -timeout 5m ./...
      - name: Outbox authority repeated regression
        run: |
          go test -race -count=20 -timeout 1m ./internal/outbox
          go test -race -shuffle=on -count=3 -timeout 2m ./internal/store/postgres -run 'TestPostgres(Outbox|EverySettlement|RecoveryAfterClaim|DispatchHolds|ConcurrentDispatch|MismatchedRisk|ExpiredAndCancelled|UnknownOutcome|RiskRejection|FaultInjectionSchemaIsolation)'
      - name: Prepared Runtime and Context repeated regression
        run: go test -race -count=10 -timeout 2m ./internal/runtime/codexapp ./internal/contextbundle
      - name: Worker admission repeated regression
        run: |
          go test -race -count=20 -timeout 2m ./internal/workerqueue ./internal/workeragent ./internal/workerloop ./internal/controlclient
          go test -race -shuffle=on -count=3 -timeout 2m ./internal/store/postgres -run TestWorkerInbox
          go test -race -count=3 -timeout 2m ./cmd/control-plane -run TestWorkerCommand
      - name: Worker preparation and independent workspace regression
        run: |
          go test -race -count=5 -timeout 2m ./internal/workspace ./internal/preparation
          go test -race -shuffle=on -count=3 -timeout 2m ./internal/store/postgres -run TestPreparationStore
          go test -race -count=3 -timeout 3m ./cmd/control-plane -run TestPreparationCommand
      - name: Offline authority repeated database regression
        run: go test -race -shuffle=on -count=3 -timeout 2m ./internal/store/postgres -run TestOfflineStore
      - name: Vet
        run: go vet ./...
      - name: Build binaries
        run: |
          go build ./cmd/control-plane
          go build ./cmd/eng
          go build ./cmd/worker
          CGO_ENABLED=0 go build ./cmd/sandbox-guard

  offline:
    name: offline-container-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engineering_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d engineering_platform"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/engineering_platform?sslmode=disable
      EP_SANDBOX_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Require real container environment
        run: |
          test "$(id -u)" -ne 0
          test -S /var/run/docker.sock
          docker version
          go mod download
      - name: Real offline boundary and command integration
        run: go test -race -v -count=2 -timeout 5m ./internal/sandbox ./cmd/control-plane -run 'TestRealOffline|TestOfflineCommand'
