name: Temporary source-bound Context inventory digest (no Codex)

on:
  push:
    branches: [audit/ep-nocodex-exact-head-20261031]
    paths:
      - .github/workflows/temporary-context-inventory-digest-20261101.yml

permissions:
  contents: read

jobs:
  inventory:
    if: github.repository == 'jiying2007/engineering-platform' && github.ref == 'refs/heads/audit/ep-nocodex-exact-head-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact failed PR HEAD with no persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 0b9e2fc4d190e608d27d68ecf5534d943721ce39
          persist-credentials: false
      - name: Go toolchain for standard-library AST scanner only
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Compare new source byte digest and exact reviewed Context rows
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0b9e2fc4d190e608d27d68ecf5534d943721ce39
          test -z "$(git status --porcelain)"
          if command -v codex >/dev/null 2>&1; then exit 1; fi
          python3 -B scripts/authority_context_inventory.py --root . --out "$RUNNER_TEMP/context-inventory.json"
          python3 -B - "$RUNNER_TEMP/context-inventory.json" "$RUNNER_TEMP/context-summary.json" <<'PY'
          import json, re, sys
          from pathlib import Path
          inventory = json.loads(Path(sys.argv[1]).read_text())
          doc = Path("docs/implementation/CONTEXT_LIFECYCLE_INVENTORY_V1.md").read_text()
          digests = re.findall(r"`(sha256:[0-9a-f]{64})`", doc)
          pat = r"^\\| `([^`]+):(\\d+)` \\| `(Background|TODO|WithoutCancel)` \\| ([^|]+) \\|$"
          reviewed = [(p, int(l), n, c.strip()) for p, l, n, c in re.findall(pat, doc, re.M)]
          current = [(x["path"], x["line"], x["name"]) for x in inventory["context_or_call_candidates"] if x["kind"] == "context_constructor"]
          exact = [(p, l, n) for p, l, n, _ in reviewed] == current
          out = {"source_sha": "0b9e2fc4d190e608d27d68ecf5534d943721ce39",
                 "source_digest": inventory["source_files_digest"],
                 "prior_doc_digests": digests,
                 "direct_constructor_count": len(current),
                 "reviewed_row_count": len(reviewed),
                 "rows_identical": exact,
                 "added_or_removed": [list(x) for x in sorted(set(current) ^ set((p,l,n) for p,l,n,_ in reviewed))],
                 "not_229_closure": True, "model_turns": 0}
          Path(sys.argv[2]).write_text(json.dumps(out, sort_keys=True, indent=2)+"\\n")
          print(json.dumps(out, sort_keys=True))
          if not exact or len(digests)!=1 or len(current)!=61:
              raise SystemExit("SOURCE_CONTEXT_ROW_DRIFT_REQUIRES_REVIEW")
          PY
      - name: Retain exact digest and source inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: context-digest-pr300-${{ github.sha }}
          path: |
            ${{ runner.temp }}/context-inventory.json
            ${{ runner.temp }}/context-summary.json
          if-no-files-found: warn
          retention-days: 30
