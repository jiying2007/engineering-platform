name: Materialize exact Runtime source once
on:
  push:
    branches: [fix/runtime-settlement-causes-20261012]
permissions:
  contents: read
jobs:
  source:
    if: ${{ github.repository == 'jiying2007/engineering-platform' && github.ref == 'refs/heads/fix/runtime-settlement-causes-20261012' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write # Immutable blobs only; no commits, refs or candidate execution.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact input patch and export source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .ep-transfer/export-runtime.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: runtime-source-objects-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-source-objects
          if-no-files-found: error
          retention-days: 1
# Removed before final PR head. No model, environment archive, secrets, deployment or Recovery.
