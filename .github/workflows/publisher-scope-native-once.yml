name: Exact Publisher lifecycle qualification
on:
  push:
    branches: [feat/publication-recovery-witness-20261012]
permissions:
  contents: read
jobs:
  native:
    if: ${{ github.repository == 'jiying2007/engineering-platform' && github.ref == 'refs/heads/feat/publication-recovery-witness-20261012' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write # Final immutable blob export only; no tree/commit/ref mutation.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Materialize reviewed source with complete tree verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/publisher-evidence"
          python3 - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          expected=['ef5d98fdb92d9c7f572d349b3062e3949ae1dd47','fdac04d9f5a13dfae8902af69581b0ba13d2bb7d','55dcafa41bf74ccda4ac55fcb6d2018419acfe91']
          parts=[]
          for i,sha in enumerate(expected):
              data=Path(f'.ci-publisher/patch.{i}.b64').read_bytes()
              if i==0:
                  # Two identified text-copy errors, never an alternate patch.
                  assert data.count(b'KI3T27')==1 and data.count(b'vVZPNvZbDb')==1
                  data=data.replace(b'KI3T27',b'KI3S27').replace(b'vVZPNvZbDb',b'vVZPNvZ7Db')
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              parts.append(data)
          encoded=b''.join(parts);assert len(encoded)==20008
          compressed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='5c3aedc5d2c0563329fd7b6e79b66c278f150fbe2fa48d5b82acc10f59dabf1d'
          patch=gzip.decompress(compressed)
          assert len(patch)==50118 and hashlib.sha256(patch).hexdigest()=='d747049e6a22804ea724c86553b851184b4994cec75fdfcee9f9e1a54caa3d11'
          subprocess.run(['git','apply','--index','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          paths=['.github/workflows/publisher-scope-native-once.yml',*[f'.ci-publisher/patch.{i}.b64' for i in range(3)]]
          subprocess.run(['git','rm','--cached',*paths],check=True)
          for p in paths:Path(p).unlink()
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='d98ae919457f349bd12dfb69cb90c0595890b449'
          PY
          git diff --cached --check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Require kernel tests with job-specific test executable permission
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/ep-publisher-go-tmp"
          mkdir "$tmp"
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            command -v apparmor_parser >/dev/null
            printf 'abi <abi/4.0>,\nprofile ep-publisher-go-tests %s/go-build*/b*/*.test flags=(unconfined) {\n  userns,\n}\n' "$tmp" > "$RUNNER_TEMP/publisher-tests.apparmor"
            sudo apparmor_parser -r "$RUNNER_TEMP/publisher-tests.apparmor"
          fi
          echo "TMPDIR=$tmp" >> "$GITHUB_ENV"
          echo "EP_REQUIRE_PID_NAMESPACE_TESTS=1" >> "$GITHUB_ENV"
          go version | tee "$RUNNER_TEMP/publisher-evidence/go-version.txt"
          go mod download
      - name: Preserve original-code detached-descendant failure
        shell: bash
        run: |
          set -euo pipefail
          git show c449d7c3f1bfaab3f9f07b61d1992d7248c6d285:internal/githubpublish/github.go > "$RUNNER_TEMP/publisher-evidence/original-github.go"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'publisher-evidence'
          (out/'overlay.json').write_text(json.dumps({'Replace':{str(Path('internal/githubpublish/github.go').resolve()):str(out/'original-github.go')}}))
          PY
          set +e
          go test -overlay "$RUNNER_TEMP/publisher-evidence/overlay.json" -race -v -count=1 -timeout 30s ./internal/githubpublish -run '^TestPublisherGitOutputReapsDetachedDescendant$' > "$RUNNER_TEMP/publisher-evidence/original-failure.log" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -F 'detached Git descendant survived original parent return' "$RUNNER_TEMP/publisher-evidence/original-failure.log"
          ! grep -q -- '--- SKIP:' "$RUNNER_TEMP/publisher-evidence/original-failure.log"
      - name: Verify fixed kernel path and v2 host admission without skipped cases
        shell: bash
        run: |
          set -euo pipefail
          go test -json -race -count=3 -timeout 90s ./internal/githubpublish -run '^Test(PublisherGit|GitHubPublishNeverReopensClosedDeterministicBranch|GitHubNullOpenPullReadbackNeverAuthorizesCreate)' | tee "$RUNNER_TEMP/publisher-evidence/kernel-tests.jsonl"
          python3 -B scripts/verify_publication_recovery_log.py "$RUNNER_TEMP/publisher-evidence/kernel-tests.jsonl" --publisher-kernel
          go test -json -race -count=10 -timeout 2m ./internal/production | tee "$RUNNER_TEMP/publisher-evidence/host-tests.jsonl"
          ! grep -q '"Action":"skip"' "$RUNNER_TEMP/publisher-evidence/host-tests.jsonl"
          go vet ./...
          python3 -B scripts/test_verify_context_inventory.py
          python3 -B scripts/verify_context_inventory.py --root . | tee "$RUNNER_TEMP/publisher-evidence/context-inventory.json"
          python3 -B scripts/test_verify_publication_recovery_log.py
          python3 -B scripts/test_verify_retained_prototype_refs.py
      - name: Export validated immutable file blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          repo='jiying2007/engineering-platform';base='c449d7c3f1bfaab3f9f07b61d1992d7248c6d285'
          assert os.environ['GITHUB_REPOSITORY']==repo
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='d98ae919457f349bd12dfb69cb90c0595890b449'
          paths=subprocess.check_output(['git','diff','--cached','--name-only',base],text=True).splitlines()
          assert len(paths)==20 and not any(p.startswith('.ci-publisher/') or p.endswith('native-once.yml') for p in paths)
          records=[]
          for path in paths:
              f=Path(path);assert f.is_file() and not f.is_symlink()
              data=f.read_bytes();assert len(data)<100000
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              request=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode()
              response=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/blobs','--input','-'],input=request))
              assert response['sha']==sha
              mode=subprocess.check_output(['git','ls-files','-s','--',path],text=True).split()[0]
              records.append({'path':path,'mode':mode,'sha':sha,'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)})
          result={'version':1,'base':base,'tree':tree,'files':records,'remote_ref_writes':False,'live_provider_executed':False,'production_qualified':False}
          out=Path(os.environ['RUNNER_TEMP'])/'publisher-evidence'
          (out/'objects.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ always() }}
        with:
          name: publisher-native-${{ github.sha }}
          path: ${{ runner.temp }}/publisher-evidence
          if-no-files-found: error
          retention-days: 30
# Temporary exact-source bridge on the formerly empty preparation branch.
# Final tree excludes this workflow and all three transport parts. No remote
# tree/commit/ref writes, provider/model operation, or production deployment.
