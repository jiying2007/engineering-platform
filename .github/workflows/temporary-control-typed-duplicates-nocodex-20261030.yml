name: Temporary Control duplicate typed JSON Go qualification (no Codex)

on:
  push:
    branches: [fix/control-nested-response-alias-20261027]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'jiying2007/engineering-platform' && github.ref == 'refs/heads/fix/control-nested-response-alias-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engineering_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d engineering_platform"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/engineering_platform?sslmode=disable
    steps:
      - name: Checkout source fixed by immutable commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 49bdc158529d1563d58fb9f0689bf0d19d452572
          persist-credentials: false
      - name: Configure Go from repository
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Run exact-source Go1.26.10 regression and full repository race
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private-embed-proof"
          test "$(git rev-parse HEAD)" = '49bdc158529d1563d58fb9f0689bf0d19d452572'
          test "$(git hash-object internal/controlclient/response.go)" = '2ba6aaec1246cc43769588922122e00b8f04e842'
          test "$(git hash-object internal/controlclient/response_alias_private_embed_test.go)" = '43dc3304f36ab996c68cb00a4dba8654bb38715a'
          test "$(git hash-object internal/controlclient/response_alias_embedded_precedence_test.go)" = 'e9ec6d080c6dbc381f0ef467f89520d01770cddc'
          test "$(git hash-object internal/controlclient/response_alias_duplicate_test.go)" = '0e86ee5e6b8797aa0bb5917c0552c2724fa8833b'
          go version | tee "$RUNNER_TEMP/private-embed-proof/toolchain.txt"
          test "$(go version | awk '{print $3}')" = 'go1.26.10'
          if command -v codex >/dev/null 2>&1; then echo 'Codex executable found: refusing to run' >&2; exit 1; fi
          test -z "$(gofmt -l internal/controlclient/*.go)"
          timeout 180s go mod download
          timeout 240s go test -race -count=20 -timeout=3m ./internal/controlclient -run '^(TestDuplicateTypedResponseMemberRejected|TestDuplicateResponseMemberIndependentObjectAndMapSemantics|TestDuplicateTypedResponseRootArrayMap|TestTaggedUnexportedEmbeddedStructAliases|TestTypedResponseEmbeddedFieldPriority)$' 2>&1 | tee "$RUNNER_TEMP/private-embed-proof/targeted-race.txt"
          tmp="$RUNNER_TEMP/ep-private-embed-tests"
          mkdir "$tmp"
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            command -v apparmor_parser >/dev/null
            printf 'abi <abi/4.0>,\nprofile ep-namespace-go-tests %s/go-build*/b*/*.test flags=(unconfined) {\n  userns,\n}\n' "$tmp" > "$RUNNER_TEMP/ep-private-embed.apparmor"
            sudo apparmor_parser -r "$RUNNER_TEMP/ep-private-embed.apparmor"
          fi
          export TMPDIR="$tmp" EP_REQUIRE_PID_NAMESPACE_TESTS=1
          timeout 720s go test -race -timeout 5m ./... 2>&1 | tee "$RUNNER_TEMP/private-embed-proof/full-race.txt"
          timeout 180s go vet ./... 2>&1 | tee "$RUNNER_TEMP/private-embed-proof/full-vet.txt"
          git rev-parse HEAD | tee "$RUNNER_TEMP/private-embed-proof/source-head.txt"
          echo 'SUPPLEMENTARY_ONLY: no Codex/Work/model/Provider or production qualification' | tee "$RUNNER_TEMP/private-embed-proof/scope.txt"
      - name: Retain source-bound logs even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: private-embed-nocodex-${{ github.sha }}
          path: ${{ runner.temp }}/private-embed-proof/
          if-no-files-found: warn
          retention-days: 30
