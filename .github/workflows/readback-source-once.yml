name: Materialize exact integrated readback source once
on:
  push:
    branches: [fix/publication-failure-readback-20261012]
permissions:
  contents: read
jobs:
  source:
    if: ${{ github.repository == 'jiying2007/engineering-platform' && github.ref == 'refs/heads/fix/publication-failure-readback-20261012' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write # Creates only immutable blob objects; never commits or refs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact original inputs and transfer tested source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .ep-transfer/export.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: integrated-readback-objects-${{ github.sha }}
          path: ${{ runner.temp }}/readback-objects
          if-no-files-found: error
          retention-days: 1
# Temporary source transfer, absent from final PR head. No candidate code,
# credentials, environment archive, provider/model, commits, refs or deployment.
