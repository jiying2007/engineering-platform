name: Read exact post-264 source once
on:
  push:
    branches: [fix/publication-failure-readback-20261012]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 01026af19fb2a62d74e65019c6bb2bea8e15b12f
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 01026af19fb2a62d74e65019c6bb2bea8e15b12f
          mkdir "$RUNNER_TEMP/readback-source"
          git archive --format=tar HEAD > "$RUNNER_TEMP/readback-source/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/readback-source/SOURCE_SHA"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/readback-source/SOURCE_TREE"
          (cd "$RUNNER_TEMP/readback-source" && sha256sum source.tar > SHA256SUMS)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: post-264-source-${{ github.sha }}
          path: ${{ runner.temp }}/readback-source
          if-no-files-found: error
          retention-days: 1
# Temporary branch-only source readback. Removed before final PR qualification.
# No .git, environment, host data, model, credentials or candidate execution.
