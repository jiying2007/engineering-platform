name: Recovery readback source objects
on:
  pull_request:
    paths: ['.github/workflows/rc-readback-source.yml', '.rc-readback-source.b64']
permissions:
  contents: read
jobs:
  objects:
    if: github.repository == 'jiying2007/engineering-platform' && github.event.pull_request.head.repo.id == 1383377268 && github.event.pull_request.head.ref == 'feat/rc-execution-readback'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Construct exact tested source objects without changing a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import base64,gzip,hashlib,io,json,os,pathlib,subprocess
          def git(*args): return subprocess.check_output(['git',*args]).decode().strip()
          base='9d0e2650dd5f305b0d2803cf7e64dec3bb581137'
          base_tree='245710866ab67287aded9a47fd21d62f71302299'
          expected='8fae4016721aee9f66c4718fc666ae2846cb85f9'
          assert git('rev-parse',base+'^{tree}')==base_tree
          encoded=pathlib.Path('.rc-readback-source.b64').read_bytes()
          assert len(encoded)==17576
          with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(encoded,validate=True))) as z: patch=z.read(65537)
          assert len(patch)==49922 and hashlib.sha256(patch).hexdigest()=='60b696127017113240ff75e4b487eb56d54835efc140c19f13f38cce8e2fbb4e'
          assert b'diff --git a/.github/' not in patch
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          git('update-index','--force-remove','.github/workflows/rc-readback-source.yml','.rc-readback-source.b64')
          assert git('write-tree')==expected
          changed=git('diff','--cached','--name-only',base).splitlines()
          assert len(changed)==10 and all(p.startswith(('cmd/eng/','internal/','docs/')) for p in changed)
          def api(route,value):
              p=subprocess.run(['gh','api','--method','POST','repos/jiying2007/engineering-platform/git/'+route,'--input','-'],input=json.dumps(value),text=True,stdout=subprocess.PIPE,check=True,timeout=60)
              return json.loads(p.stdout)
          entries=[]
          for path in changed:
              mode,sha,stage=git('ls-files','--stage','--',path).split()[:3]
              assert mode=='100644' and stage=='0'
              raw=subprocess.check_output(['git','cat-file','blob',sha])
              assert len(raw)<1048576
              assert api('blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})['sha']==sha
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          assert api('trees',{'base_tree':base_tree,'tree':entries})['sha']==expected
          report={'base':base,'source_head':os.environ['EXPECTED_HEAD'],'tree':expected,'members':entries,'ref_mutated':False,'product_validation':False}
          pathlib.Path(os.environ['RUNNER_TEMP'],'source-objects.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          print('EXACT_PRODUCT_TREE='+expected)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: readback-source-objects-${{ github.run_id }}
          path: ${{ runner.temp }}/source-objects.json
          if-no-files-found: error
          retention-days: 7
