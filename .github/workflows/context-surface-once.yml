name: Prepare exact concrete Context surface cleanup
on:
  push:
    branches: [refactor/context-only-concrete-surface-20261013]
permissions:
  contents: read
jobs:
  prepare:
    if: ${{ github.repository == 'jiying2007/engineering-platform' && github.actor == 'jiying2007' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write # Export immutable source blobs only; no refs or issue writes.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Reject the original unscoped concrete surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 2772d0d9c1122d004c7854993bae88ac53d3a138
          out="$RUNNER_TEMP/surface-evidence"
          mkdir "$out"
          go version | tee "$out/go-version.txt"
          go mod download
          set +e
          go test -json -race -count=1 -timeout 2m ./internal/store -run '^TestConcreteAuthoritySurfacesRequireCallerContext$' > "$out/original.jsonl" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          events=[json.loads(l) for l in (Path(os.environ['RUNNER_TEMP'])/'surface-evidence/original.jsonl').read_text().splitlines() if l.startswith('{')]
          subfails=[e for e in events if e.get('Action')=='fail' and '/' in e.get('Test','')]
          assert len(subfails)==75
          assert not any(e.get('Action')=='skip' for e in events)
          assert sum('context-free authority method restored' in e.get('Output','') for e in events)==75
          PY
      - name: Type-resolve call sites and construct the exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/surface-evidence"
          go list -deps -export -test -json ./... > "$out/packages.json"
          go run .ci-surface/transform.go "$PWD" "$out/packages.json" > "$out/removal.json"
          python3 -B - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'surface-evidence/removal.json').read_text())
          assert len(data['removed'])==75 and data['production_references']==0 and len(data['test_references'])==329
          subprocess.run(['gofmt','-w',*data['changed']],check=True)
          PY
          python3 -B .ci-surface/finalize.py | tee "$out/cleanup-summary.json"
          git diff --check
          go test -json -race -count=20 -timeout 2m ./internal/store -run '^TestConcreteAuthoritySurfacesRequireCallerContext$' > "$out/fixed-20.jsonl"
          python3 -B - <<'PY'
          import collections,json,os
          from pathlib import Path
          events=[json.loads(l) for l in (Path(os.environ['RUNNER_TEMP'])/'surface-evidence/fixed-20.jsonl').read_text().splitlines() if l.startswith('{')]
          assert not any(e.get('Action') in ('skip','fail') for e in events)
          runs=collections.Counter(e['Test'] for e in events if e.get('Action')=='run' and e.get('Test'))
          passes=collections.Counter(e['Test'] for e in events if e.get('Action')=='pass' and e.get('Test'))
          assert runs==passes and len(passes)==76 and set(passes.values())=={20}
          PY
          go test -run '^$' ./... > "$out/all-package-compile.log"
          python3 -B -m unittest discover -s scripts -p 'test_*.py' -v > "$out/python-tests.log" 2>&1
          python3 -B scripts/verify_context_inventory.py --root . | tee "$out/context-inventory.json"
          go vet ./...
      - name: Export only source matching the independently reviewed final tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          base='2772d0d9c1122d004c7854993bae88ac53d3a138';repo='jiying2007/engineering-platform'
          assert os.environ['GITHUB_REPOSITORY']==repo
          subprocess.run(['git','add','--update'],check=True)
          subprocess.run(['git','rm','--cached','.ci-surface/transform.go','.ci-surface/finalize.py','.github/workflows/context-surface-once.yml'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='fb1d6d58d60d1c9cc894da122011241bab11a39b',tree
          files=subprocess.check_output(['git','diff','--cached','--name-only',base],text=True).splitlines()
          assert len(files)==63 and not any(p.startswith(('.github/','db/')) or p in ('go.mod','go.sum') for p in files)
          records=[]
          for path in files:
              raw=Path(path).read_bytes();assert len(raw)<100000
              sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              payload=json.dumps({'encoding':'base64','content':base64.b64encode(raw).decode()}).encode()
              result=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/blobs','--input','-'],input=payload))
              assert result['sha']==sha
              records.append({'path':path,'sha':sha,'sha256':hashlib.sha256(raw).hexdigest(),'size':len(raw)})
          output={'base_commit':base,'base_tree':'567db158c2b3f7ede3ef49a20a74c4d802a2ef8c','tree':tree,'files':records,'ref_writes':False,'live_provider_executed':False,'production_qualified':False}
          out=Path(os.environ['RUNNER_TEMP'])/'surface-evidence'
          (out/'source-objects.json').write_text(json.dumps(output,indent=2)+'\n')
          (out/'source.tar').write_bytes(subprocess.check_output(['git','archive','--format=tar',tree]))
          (out/'candidate.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary',base]))
          print(json.dumps(output,indent=2))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ always() }}
        with:
          name: concrete-context-surface-${{ github.sha }}
          path: ${{ runner.temp }}/surface-evidence
          if-no-files-found: error
          retention-days: 30
# Temporary source preparation only; removed before final PR qualification.
