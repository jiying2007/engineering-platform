name: Witness integrity exact source
on:
  push:
    branches: [fix/witness-proof-integrity-20261013]
permissions:
  contents: read
jobs:
  qualify:
    if: ${{ github.repository == 'jiying2007/engineering-platform' && github.ref == 'refs/heads/fix/witness-proof-integrity-20261013' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write # Immutable file blobs only, never remote commits/refs.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engineering_platform
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d engineering_platform"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/engineering_platform?sslmode=disable
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Materialize exact reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/witness-integrity-evidence"
          python3 -B - <<'PY'
          import base64,lzma,hashlib,subprocess
          from pathlib import Path
          encoded=b''.join(Path(f'.ci-witness-integrity/patch.{i}.b64').read_bytes() for i in range(2))
          assert len(encoded)==16840
          compressed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='f21c80abb3a04f06ee550c8b2e40bfa56e8f64fd69f46af53108974ed6448ce8'
          patch=lzma.decompress(compressed)
          assert len(patch)==53821 and hashlib.sha256(patch).hexdigest()=='0ed1af00b9c88f4d09e6b4065a8a8692b41fa3c6e8ca895631309d1b4b00947a'
          subprocess.run(['git','apply','--index','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          names=['.github/workflows/witness-integrity-source-once.yml',*[f'.ci-witness-integrity/patch.{i}.b64' for i in range(2)]]
          subprocess.run(['git','rm','--cached',*names],check=True)
          for name in names: Path(name).unlink()
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='6f03399d58d2b8663ab1ea1131ad528524d34d98'
          PY
          git diff --cached --check
          go version | tee "$RUNNER_TEMP/witness-integrity-evidence/go-version.txt"
          go mod download
      - name: Require original-reader failure on actual inode tests
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/witness-integrity-evidence"
          git show c4b4ecffbe3925aa171a8c2067a851b63426b464:internal/githubpublish/dispatch_journal.go > "$out/original-journal.go"
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'witness-integrity-evidence'
          (out/'overlay.json').write_text(json.dumps({'Replace':{str(Path('internal/githubpublish/dispatch_journal.go').resolve()):str(out/'original-journal.go')}}))
          PY
          set +e
          go test -overlay "$out/overlay.json" -race -count=1 -timeout 1m ./internal/githubpublish -run '^TestPublisherWitnessIntegrityRejectsAliasedAndSpecialFiles$' > "$out/original-failure.log" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          for kind in hardlink setuid setgid sticky; do grep -F "aliased or special witness accepted $kind" "$out/original-failure.log"; done
          ! grep -q -- '--- SKIP:' "$out/original-failure.log"
      - name: Require real process proofs and PostgreSQL17 with zero targeted skips
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/witness-integrity-evidence"
          go test -json -race -count=3 -timeout 2m ./internal/githubpublish -run '^TestPublisher(CompletionProof|WitnessIntegrity)' | tee "$out/proof-tests.jsonl"
          python3 -B scripts/verify_publication_recovery_log.py "$out/proof-tests.jsonl" --publisher-proof
          go test -json -race -count=3 -timeout 2m ./internal/store/postgres -run '^TestPublicationRecoveryDatabase' | tee "$out/pg17-tests.jsonl"
          python3 -B scripts/verify_publication_recovery_log.py "$out/pg17-tests.jsonl"
          python3 -B scripts/test_verify_publication_recovery_log.py
          python3 -B scripts/test_verify_context_inventory.py
          go vet ./...
      - name: Export only validated immutable source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          repo='jiying2007/engineering-platform';base='c4b4ecffbe3925aa171a8c2067a851b63426b464'
          assert os.environ['GITHUB_REPOSITORY']==repo
          target='6f03399d58d2b8663ab1ea1131ad528524d34d98'
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==target
          paths=subprocess.check_output(['git','diff','--cached','--name-only',base],text=True).splitlines()
          assert len(paths)==23 and not any(p.startswith('.ci-') or '__pycache__' in p or p.endswith('source-once.yml') for p in paths)
          records=[]
          for name in paths:
              p=Path(name);assert p.is_file() and not p.is_symlink()
              data=p.read_bytes();assert len(data)<100000
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              payload=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode()
              result=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/blobs','--input','-'],input=payload))
              assert result['sha']==sha
              mode=subprocess.check_output(['git','ls-files','-s','--',name],text=True).split()[0]
              records.append({'path':name,'sha':sha,'mode':mode,'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)})
          output={'version':1,'base':base,'tree':target,'files':records,'remote_ref_writes':False,'provider_executed':False,'production_qualified':False}
          out=Path(os.environ['RUNNER_TEMP'])/'witness-integrity-evidence'
          (out/'objects.json').write_text(json.dumps(output,indent=2)+'\n')
          print(json.dumps(output,indent=2))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ always() }}
        with:
          name: witness-proof-native-${{ github.sha }}
          path: ${{ runner.temp }}/witness-integrity-evidence
          if-no-files-found: error
          retention-days: 30
# Branch-only hash-bound materialization; final tree omits all transport files.
# No model, live Provider, user accounts, deployment or remote commits/refs.
