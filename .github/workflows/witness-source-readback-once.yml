name: Witness source readback
on:
  push:
    branches: [fix/publisher-witness-hardening-20261013]
permissions:
  contents: read
jobs:
  verify-and-export:
    if: ${{ github.repository == 'jiying2007/engineering-platform' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write # Immutable file blobs only, never commits/refs/merges.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engineering_platform
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d engineering_platform"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/engineering_platform?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 3
      - name: Materialize hash-bound reviewed source only
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64,lzma,hashlib,subprocess
          from pathlib import Path
          encoded=b''.join(Path(f'.ci-witness/patch.{i}.b64').read_bytes() for i in range(3))
          assert len(encoded)==28604
          compressed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='d5f7ae8e5ae99946de66f66306c1ff00a5e6dc21548b4af8ec3fa80db98383b3'
          patch=lzma.decompress(compressed)
          assert len(patch)==98704 and hashlib.sha256(patch).hexdigest()=='d1e93e599dec5d251c4b75d51ea8b3c8190323ca78bfd9728cadd332a6574e89'
          subprocess.run(['git','apply','--index','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          subprocess.run(['git','rm','--cached','.github/workflows/witness-source-readback-once.yml',*[f'.ci-witness/patch.{i}.b64' for i in range(3)]],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='d28dbf473c2f6d7809ebc1d5ac03766e173232ed'
          PY
          git diff --cached --check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Actual inode lock, crash and PostgreSQL 17 regressions
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/witness-evidence"
          mkdir "$out"
          go version | tee "$out/go-version.txt"
          go mod download
          python3 -B scripts/test_verify_publication_recovery_log.py
          python3 -B scripts/verify_context_inventory.py --root . | tee "$out/context-inventory.json"
          go test -json -race -count=3 -timeout 90s ./internal/githubpublish -run '^TestPublisher(NoInvocation|InvocationBarrier|Uninvoked)' | tee "$out/publisher.jsonl"
          python3 -B scripts/verify_publication_recovery_log.py "$out/publisher.jsonl" --no-invocation-publisher
          go test -json -race -count=3 -timeout 2m ./internal/store/postgres -run '^TestNoInvocationDatabase' | tee "$out/database.jsonl"
          python3 -B scripts/verify_publication_recovery_log.py "$out/database.jsonl" --no-invocation-db
          EP_RESTORE_DRILL=1 go test -json -race -count=1 -timeout 8m ./internal/store/postgres -run '^(TestPostgresAuthorityRestoreDrill|TestPublicationRecoveryRestoreDrill|TestNoInvocationRestoreDrill)$' | tee "$out/restore.jsonl"
          python3 -B scripts/verify_publication_recovery_log.py "$out/restore.jsonl" --restore
          go vet ./...
      - name: Export exact validated immutable file objects only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          repo='jiying2007/engineering-platform';base='2e44ef83804992cbbbd713b7a7af7c556f07f19b';tree='d28dbf473c2f6d7809ebc1d5ac03766e173232ed'
          assert os.environ['GITHUB_REPOSITORY']==repo
          paths=subprocess.check_output(['git','diff','--cached','--name-only',base],text=True).splitlines()
          assert len(paths)==24 and not any(p.startswith('.ci-') or '__pycache__' in p or p.endswith('once.yml') for p in paths)
          out=Path(os.environ['RUNNER_TEMP'])/'witness-evidence';records=[]
          for p in paths:
              f=Path(p);assert f.is_file() and not f.is_symlink()
              raw=f.read_bytes();assert len(raw)<100000
              sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              request=json.dumps({'encoding':'base64','content':base64.b64encode(raw).decode()}).encode()
              result=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/blobs','--input','-'],input=request))
              assert result['sha']==sha
              mode=subprocess.check_output(['git','ls-files','-s','--',p],text=True).split()[0]
              records.append({'path':p,'mode':mode,'sha':sha,'sha256':hashlib.sha256(raw).hexdigest(),'size':len(raw)})
          (out/'source-objects.json').write_text(json.dumps({'base':base,'tree':tree,'files':records,'ref_writes':False,'live_provider_executed':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ always() }}
        with:
          name: witness-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/witness-evidence
          if-no-files-found: error
          retention-days: 30
# Temporary branch-only hash-pinned qualification/transport. Final product tree
# contains no capsules/workflow. No model/provider/account/deployment or ref write.
