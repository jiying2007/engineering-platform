name: Eng local CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: eng-local-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eng-local:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: tool/go.mod
          cache: false
      - name: Print the exact retained Context inventory digest (diagnostic only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/authority_context_inventory.py --root . --out "$RUNNER_TEMP/eng-context-inventory.json"
          python3 -c 'import json,sys; o=json.load(open(sys.argv[1])); print("CURRENT_CONTEXT_DIGEST="+o["source_files_digest"]); print("CONTEXT_CANDIDATES="+str(len(o["context_or_call_candidates"])))' "$RUNNER_TEMP/eng-context-inventory.json"
      - name: Dependencies and format
        working-directory: tool
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(gofmt -l cmd internal)"
      - name: Real local lifecycle tests without model calls
        working-directory: tool
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout 3m -json ./... | tee "$RUNNER_TEMP/eng-test-events.jsonl"
          python3 - "$RUNNER_TEMP/eng-test-events.jsonl" <<'PY'
          import json, sys
          rows = [json.loads(line) for line in open(sys.argv[1])]
          required = {
              "TestServePrivateSocketQueuesWhileBusy",
              "TestForwardAfterAcceptedRequestDoesNotReplay",
              "TestForwardRefusedSocketUsesLocalCLI",
              "TestServeRejectsForbiddenAndOversizedRequests",
          }
          passed = {row.get("Test") for row in rows if row.get("Action") == "pass"}
          assert required <= passed, f"Real Unix socket tests did not pass: {required-passed}"
          PY
          go vet ./...
      - name: Scan the active module for known Go vulnerabilities
        working-directory: tool
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/eng-scan-bin" timeout 180s go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          timeout 120s "$RUNNER_TEMP/eng-scan-bin/govulncheck" -show=version,traces ./...
      - name: Build the exact Ubuntu package
        shell: bash
        env:
          ENG_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash tool/scripts/build-release.sh
          cp "$RUNNER_TEMP/eng-test-events.jsonl" tool/dist/eng-test-events.jsonl
      - name: Install and run the packaged no-model example
        shell: bash
        run: bash tool/scripts/smoke-release.sh tool/dist/eng-linux-amd64.tgz
      - name: Retain reviewed package and checksums
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: eng-linux-amd64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            tool/dist/eng-linux-amd64.tgz
            tool/dist/eng-linux-amd64.tgz.sha256
            tool/dist/eng-test-events.jsonl
          retention-days: 90
          if-no-files-found: error
