name: One-time source transfer
on:
  pull_request:
    paths: ['.github/workflows/source-transfer-once.yml']
permissions:
  contents: read
jobs:
  transfer:
    if: >-
      github.repository == 'jiying2007/engineering-platform' &&
      github.event.pull_request.head.repo.id == 1383377268 &&
      github.event.pull_request.head.ref == 'feat/authorized-source-continuation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Materialize exact tested source on named development branch
        shell: bash
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base=50630a7858ba939d361763e368be6e392d4d6075
          branch=feat/authorized-source-continuation
          expected_tree=4fbdc5b0a643e992af321286df1973fd81563219
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$base"
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$SOURCE_HEAD"
          cat .source-transfer/part0 .source-transfer/part1 .source-transfer/part20 .source-transfer/part21 .source-transfer/part22 > "$RUNNER_TEMP/source.patch.gz"
          printf '%s  %s\n' fe38e82641bd0b15e7b8bac5782468a5b326c16c2f0f148ba7fee28e5fef260d "$RUNNER_TEMP/source.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/source.patch.gz" > "$RUNNER_TEMP/source.patch"
          printf '%s  %s\n' 8c90ba7d4d489a484db4722916ca1486186e9fb4a06d953d91ab8cd74568b5db "$RUNNER_TEMP/source.patch" | sha256sum -c -
          git read-tree --reset -u "$base"
          git apply --index "$RUNNER_TEMP/source.patch"
          test "$(git write-tree)" = "$expected_tree"
          # This token cannot change workflows. Keep its own transport unchanged;
          # the authorized connector removes transport before actual final CI.
          git restore --source="$SOURCE_HEAD" --staged --worktree -- .github/workflows/source-transfer-once.yml .source-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree="$(git write-tree)"
          commit="$(git commit-tree "$tree" -p "$SOURCE_HEAD" -m 'feat(continuation): materialize exact tested stopped-source continuation')"
          git push origin "$commit:refs/heads/$branch"
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$commit"
          jq -n --arg commit "$commit" --arg tree "$tree" --arg product_tree "$expected_tree" '{commit:$commit,staging_tree:$tree,product_tree:$product_tree,status:"SOURCE_TRANSFER_READBACK_VERIFIED",qualification_granted:false}' > "$RUNNER_TEMP/source-transfer.json"
      - uses: actions/upload-artifact@v4
        with:
          name: source-transfer-${{ github.run_id }}
          path: ${{ runner.temp }}/source-transfer.json
          if-no-files-found: error
          retention-days: 7
