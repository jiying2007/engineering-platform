name: One-time source transfer
on:
  pull_request:
    paths: ['.github/workflows/source-transfer-once.yml', '.source-transfer.patch.gz']
permissions:
  contents: read
jobs:
  transfer:
    if: >-
      github.repository == 'jiying2007/engineering-platform' &&
      github.event.pull_request.head.repo.id == 1383377268 &&
      github.event.pull_request.head.ref == 'fix/runtime-process-scope'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Materialize exact tested source tree on this branch only
        shell: bash
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base=62c859ac77acc362471bb468f5c81cbd84bd48b8
          branch=fix/runtime-process-scope
          expected_tree=942c159246e218af92a6a0609a5498d54c1cb3cb
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$base"
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$SOURCE_HEAD"
          printf '%s  %s\n' 76419bb62bbeec319422a94b2a9e330afc5d634bc16ffb33db943e96b5cb8d4a .source-transfer.patch.gz | sha256sum -c -
          gzip -dc .source-transfer.patch.gz > "$RUNNER_TEMP/tested-source.patch"
          printf '%s  %s\n' e010f872510dc45eba9aa5335da8b83a639c0d6554eed3c1ccf745d7fd31a124 "$RUNNER_TEMP/tested-source.patch" | sha256sum -c -
          git read-tree --reset -u "$base"
          git apply --index "$RUNNER_TEMP/tested-source.patch"
          test "$(git write-tree)" = "$expected_tree"
          test ! -e .github/workflows/source-transfer-once.yml
          test ! -e .source-transfer.patch.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(git commit-tree "$expected_tree" -p "$SOURCE_HEAD" -m 'fix(runtime): bind engineering results to kernel-confirmed descendant termination')"
          git merge-base --is-ancestor "$SOURCE_HEAD" "$commit"
          git push origin "$commit:refs/heads/$branch"
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$commit"
          jq -n --arg commit "$commit" --arg tree "$expected_tree" '{commit:$commit,tree:$tree,status:"SOURCE_TRANSFER_READBACK_VERIFIED",qualification_granted:false}' > "$RUNNER_TEMP/source-transfer.json"
      - uses: actions/upload-artifact@v4
        with:
          name: source-transfer-${{ github.run_id }}
          path: ${{ runner.temp }}/source-transfer.json
          if-no-files-found: error
          retention-days: 7
