name: One-time source transfer
on:
  pull_request:
    paths: ['.github/workflows/source-transfer-once.yml', '.source-transfer/**']
permissions:
  contents: read
jobs:
  transfer:
    if: >-
      github.repository == 'jiying2007/engineering-platform' &&
      github.event.pull_request.head.repo.id == 1383377268 &&
      github.event.pull_request.head.ref == 'feat/stopped-source-checkpoint'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Materialize pinned tested source without changing workflow files
        shell: bash
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base=842f6d8688eda2a4c273ee345647563637056722
          branch=feat/stopped-source-checkpoint
          product_tree=19fc158e9c512d8d65a7254d1a09dc06cff5b34d
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$base"
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$SOURCE_HEAD"
          cat .source-transfer/1 .source-transfer/2a .source-transfer/2b .source-transfer/2c > "$RUNNER_TEMP/source.patch.gz"
          printf '%s  %s\n' de206197650fd6d23023164619a7c87c38c03fd6c1cdceb94a55f0478d535c39 "$RUNNER_TEMP/source.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/source.patch.gz" > "$RUNNER_TEMP/source.patch"
          printf '%s  %s\n' ed42d4e69e7eb39629994ced1271a54b43a1e68220d524321a8708ac45e8956f "$RUNNER_TEMP/source.patch" | sha256sum -c -
          git apply --index "$RUNNER_TEMP/source.patch"
          cp .git/index "$RUNNER_TEMP/product.index"
          GIT_INDEX_FILE="$RUNNER_TEMP/product.index" git update-index --force-remove .source-transfer/1 .source-transfer/2a .source-transfer/2b .source-transfer/2c .github/workflows/source-transfer-once.yml
          test "$(GIT_INDEX_FILE="$RUNNER_TEMP/product.index" git write-tree)" = "$product_tree"
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          tree="$(git write-tree)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(git commit-tree "$tree" -p "$SOURCE_HEAD" -m 'feat(checkpoint): materialize exact tested stopped source capture and restore')"
          git push origin "$commit:refs/heads/$branch"
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$commit"
          jq -n --arg commit "$commit" --arg tree "$tree" --arg product_tree "$product_tree" '{commit:$commit,tree:$tree,product_tree:$product_tree,status:"SOURCE_MATERIALIZED_NOT_QUALIFIED",qualification_granted:false}' > "$RUNNER_TEMP/source-transfer.json"
      - uses: actions/upload-artifact@v4
        with:
          name: source-transfer-${{ github.run_id }}
          path: ${{ runner.temp }}/source-transfer.json
          if-no-files-found: error
          retention-days: 7
