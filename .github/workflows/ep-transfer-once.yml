name: Materialize reviewed maintenance source once
on:
  push:
    branches: [fix/maintenance-lifecycle-20261012]
permissions:
  contents: write
jobs:
  source-objects:
    if: ${{ github.repository == 'jiying2007/engineering-platform' && github.ref == 'refs/heads/fix/maintenance-lifecycle-20261012' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Apply hash-pinned reviewed source and export immutable blobs only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess
          from pathlib import Path
          base='2324d5c3b153f2f9a5e7edf8878e9b30a41d191d'
          target='cc252fec20e0928031f5b0891dab151af9484eb3'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert os.environ['GITHUB_REPOSITORY']=='jiying2007/engineering-platform'
          assert os.environ['GITHUB_REF']=='refs/heads/fix/maintenance-lifecycle-20261012'
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^')==base
          assert git('rev-parse',base+'^{tree}')=='57635edffbf65beedf522a6ab1e15b9505e50857'
          raw=Path('.ep-transfer/capsule.b64').read_bytes()
          assert len(raw)==13605 and hashlib.sha256(raw).hexdigest()=='46496b195294e7d05459dd72e807a2d03034b5f23c237fcf6962763c7cf2cbcc'
          capsule=json.loads(gzip.decompress(base64.b64decode(raw)))
          assert capsule['version']==1 and capsule['target_tree']==target
          patch=capsule['patch'].encode()
          assert hashlib.sha256(patch).hexdigest()=='b534c89ae2211a92a01982ff0874c1198019a3f6185067a0f51524a1f7e6981d'
          paths=['docs/implementation/WORKSPACE_CLEANUP_LIFECYCLE_V1.md','docs/status/IMPLEMENTATION_STATUS.md','internal/api/authenticated_test.go','internal/api/server_test.go','internal/preparation/cleanup_error_test.go','internal/preparation/prepare.go','internal/store/memory.go','internal/store/scoped_interface_test.go','internal/workeragent/prepared.go','internal/workspace/cleanup.go','internal/workspace/cleanup_test.go','internal/workspace/manager.go']
          assert capsule['paths']==paths
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          subprocess.run(['git','rm','--','.ep-transfer/capsule.b64','.github/workflows/ep-transfer-once.yml'],check=True)
          assert git('write-tree')==target
          assert git('diff','--cached','--name-only',base).splitlines()==paths
          out=Path(os.environ['RUNNER_TEMP'])/'maintenance-objects';out.mkdir()
          receipt={'version':1,'base_commit':base,'source_transport_head':git('rev-parse','HEAD'),'final_tree':target,'code_executed':False,'ref_mutation_performed':False,'files':[]}
          request=out/'request.json'
          for name in paths:
              p=Path(name);assert p.is_file() and not p.is_symlink()
              data=p.read_bytes();assert len(data)<1<<20
              blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              request.write_text(json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}))
              result=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/jiying2007/engineering-platform/git/blobs','--input',str(request)],text=True))
              assert result['sha']==blob
              receipt['files'].append({'path':name,'blob_sha':blob,'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)})
          request.unlink()
          (out/'objects.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: maintenance-source-objects-${{ github.sha }}
          path: ${{ runner.temp }}/maintenance-objects
          if-no-files-found: error
          retention-days: 1
# Temporary source-only transport; removed from the final tree before PR CI.
# Executes only this pinned transformer, not candidate code. Never writes refs,
# commits, deployments, credentials, external effects, or recovery state.
