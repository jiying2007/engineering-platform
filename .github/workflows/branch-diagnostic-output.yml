name: Temporary bounded diagnostics verification (no Codex)
# Exact-source retry after formatter and terminal import corrections; same checks preserved.
on:
  push:
    branches: [fix/production-diagnostics-output-budget-20261027]
    paths: [.github/workflows/branch-diagnostic-output.yml]
permissions:
  contents: read
jobs:
  output-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Download public modules
        run: go mod download
      - name: Require exact Go format
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l cmd/eng/production_diagnostic_output.go cmd/eng/production_diagnostic_output_test.go cmd/eng/production_diagnostic_output_linux_test.go cmd/eng/production_live_observe.go cmd/eng/production_publisher_health.go cmd/eng/production_terminal_readback.go cmd/eng/production_status.go)"
          test -z "$files" || { printf 'FORMAT_DRIFT=%s\n' "$files"; gofmt -d cmd/eng/production_diagnostic_output*.go; exit 1; }
      - name: Race-test bounded diagnostic and inherited monitor pipe
        run: go test -count=1 -race -timeout 6m ./cmd/eng -run 'Test(ProductionDiagnostic|ProductionMonitorPipeOutput|ProductionLiveObserveCLI|ProductionLiveObservationNeverClaims|ProductionStatus)'
      - name: Go vet
        run: go vet ./cmd/eng
      - name: Exact source-bound Context inventory (no Codex or model turn)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/authority_context_inventory.py --root . --out "$RUNNER_TEMP/context.json"
          python3 - "$RUNNER_TEMP/context.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          origins = [x for x in data["context_or_call_candidates"] if x["kind"]=="context_constructor"]
          print("SOURCE_DIGEST="+data["source_files_digest"])
          print("DIRECT_ORIGINS="+str(len(origins)))
          for row in origins:
              if row["path"] in ("cmd/eng/production_status.go", "cmd/eng/production_live_observe.go", "cmd/eng/production_publisher_health.go", "cmd/eng/production_terminal_readback.go"):
                  print("CONTEXT_SITE="+row["path"]+":"+str(row["line"])+":"+row["name"])
          PY
