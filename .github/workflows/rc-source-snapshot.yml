name: RC source snapshot
on:
  pull_request:
    paths: ['.github/workflows/rc-source-snapshot.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c4eaa7aee68776999c789794839bb1c294891073
          fetch-depth: 0
          persist-credentials: false
      - name: Export public repository source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c4eaa7aee68776999c789794839bb1c294891073
          out="$RUNNER_TEMP/rc-source"
          mkdir "$out"
          git archive --format=tar.gz HEAD > "$out/source.tar.gz"
          git bundle create "$out/source.bundle" --all
          git rev-parse HEAD > "$out/COMMIT"
          (cd "$out" && sha256sum source.tar.gz source.bundle COMMIT > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: rc-source-c4eaa7ae-${{ github.run_id }}
          path: ${{ runner.temp }}/rc-source
          if-no-files-found: error
          retention-days: 7
