name: Verify permanent service lifecycle gate
on:
  push:
    branches: [fix/service-request-lifecycle-20261014]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Immutable blob export only; no refs, commits or issue changes.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Apply only exact three-file permanent regression addition
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/lifecycle-gate"
          python3 -B - <<'PY'
          import gzip,hashlib,subprocess
          from pathlib import Path
          raw=Path('.ci-lifecycle-gate/patch.gz').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='22dd0cde52dbdc5e8598beb46c9c9ca55885d9ca973f868403607b345f245827'
          patch=gzip.decompress(raw)
          assert len(patch)==9352 and hashlib.sha256(patch).hexdigest()=='c80820482fea7ba65f3df5e99fe1bf1a45aff43e9f68181fc5f98859fa0d9c03'
          subprocess.run(['git','apply','--index','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          subprocess.run(['git','rm','--cached','.ci-lifecycle-gate/patch.gz','.github/workflows/service-lifecycle-gate-once.yml'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='eb48285332330c3eef8055fb93ed2c7d2f4b6951'
          PY
          git diff --cached --check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Test all original scripts plus strict lifecycle selection
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/lifecycle-gate/python-tests.log"
          python3 -B scripts/verify_context_inventory.py --root . | tee "$RUNNER_TEMP/lifecycle-gate/context-binding.json"
      - name: Export three immutable source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          repo='jiying2007/engineering-platform';base='e0ba96f43de52700e7a9729e18e6244d94f1651e';tree='eb48285332330c3eef8055fb93ed2c7d2f4b6951'
          assert os.environ['GITHUB_REPOSITORY']==repo
          paths=subprocess.check_output(['git','diff','--cached','--name-only',base],text=True).splitlines()
          assert set(paths)=={'.github/workflows/ci.yml','scripts/verify_service_lifecycle_log.py','scripts/test_verify_service_lifecycle_log.py'}
          records=[]
          for path in paths:
              data=Path(path).read_bytes();assert len(data)<40000
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              payload=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode()
              obj=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/blobs','--input','-'],input=payload));assert obj['sha']==sha
              records.append({'path':path,'sha':sha,'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)})
          out=Path(os.environ['RUNNER_TEMP'])/'lifecycle-gate'
          (out/'source-objects.json').write_text(json.dumps({'base':base,'tree':tree,'files':records,'ref_writes':False},indent=2)+'\n')
          (out/'source.tar').write_bytes(subprocess.check_output(['git','archive','--format=tar',tree]))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ always() }}
        with:
          name: lifecycle-permanent-gate-${{ github.sha }}
          path: ${{ runner.temp }}/lifecycle-gate
          if-no-files-found: error
          retention-days: 30
# Temporary transport absent from the final tree. No production or recovery change.
